name: BlueStripe Software
description: 'BlueStripe Software was an application performance management (APM) vendor headquartered
  in the Research Triangle Park area of North Carolina. Its flagship product, FactFinder, provided
  application-aware infrastructure performance monitoring and end-to-end transaction tracing across
  distributed servers, letting operations teams map and troubleshoot how applications behaved across
  physical, virtual, and cloud infrastructure. The company was backed by Trinity Ventures and other
  venture investors before being acquired by Microsoft in April 2015, after which its technology was
  folded into Microsoft System Center and the Operations Management Suite (OMS) and the standalone
  BlueStripe product and developer surface were discontinued. This profile is retained in the API
  Evangelist network as a historical portfolio-lead record; the company no longer operates an
  independent website, developer portal, or API.'
